name: Blog Posts
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with latest Rabbit Hole posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pull in latest posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://thinkingsurfaces.substack.com/feed"
          max_post_count: 5
